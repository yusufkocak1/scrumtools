spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scrumtools?currentSchema=scrumtools}
    username: ${SPRING_DATASOURCE_USERNAME:scrumtools}
    password: ${SPRING_DATASOURCE_PASSWORD:scrumtools123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: scrumtools
        format_sql: true
        # Ortak çalışma append gruplaması (COLLAB_WORKSPACE_PLAN.md §12) biriken
        # güncellemeleri tek gidiş-gelişte yazsın diye JDBC toplu ekleme açık.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # ─── SMTP (yalnızca app.mail.provider=smtp iken; lokalde Mailpit: port 1025) ──
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: 8080

# ─── Actuator ────────────────────────────────────────────────────────────────
# Yalnızca health açık; endpoint SecurityConfig'teki anyRequest().authenticated()
# altında kaldığı için token gerektirir. diskspace kapalı — giriş yapmış her
# kullanıcıya sunucunun boş disk baytını göstermenin bir faydası yok.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
  health:
    diskspace:
      enabled: false

# ─── iyzico (iyzilink ödeme linkleri) ────────────────────────────────────────
iyzico:
  enabled: ${IYZICO_ENABLED:false}
  api-key: ${IYZICO_API_KEY:}
  secret-key: ${IYZICO_SECRET_KEY:}
  # Sandbox: https://sandbox-api.iyzipay.com | Prod: https://api.iyzipay.com
  base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}

# ─── SCM / Git Entegrasyonu ──────────────────────────────────────────────────
scm:
  # AES-256 anahtarı (base64, 32 byte). Boşsa Git entegrasyonu kapalı kabul edilir.
  # Üretmek için: openssl rand -base64 32
  crypto-key: ${SCM_CRYPTO_KEY:}
  # Self-hosted SCM'ler iç ağdaysa true yapın (SSRF korumasını gevşetir)
  allow-private-hosts: ${SCM_ALLOW_PRIVATE_HOSTS:false}
  # Webhook callback'lerinde kullanılacak public adres (prod: https://scrumtools.kocak.net.tr)
  # Boşsa webhook kaydı atlanır (webhookStatus=NONE), poller telafi eder.
  webhook-base-url: ${SCM_WEBHOOK_BASE_URL:}

# ─── MinIO (S3-compatible object storage) ────────────────────────────────────
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # Tarayicinin presigned URL'lerle erisecegi public adres (bos ise endpoint kullanilir)
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:scrumtools}
  secret-key: ${MINIO_SECRET_KEY:scrumtools123}
  bucket: ${MINIO_BUCKET:scrumtools-attachments}

app:
  cors:
    # Virgulle ayrilmis origin listesi (ornek: http://localhost:3000,http://SUNUCU_IP:8096)
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  mail:
    # log      → mailler gönderilmez, log'a yazılır (dev/test varsayılanı)
    # postforge → PostForge API'si üzerinden gönderilir (prod)
    # smtp     → doğrudan SMTP + Thymeleaf şablonları
    provider: ${MAIL_PROVIDER:log}
    # Yalnızca provider=smtp iken kullanılır
    from: ${MAIL_FROM:noreply@kocak.net.tr}
    postforge:
      base-url: ${POSTFORGE_BASE_URL:https://postforge.kocak.net.tr}
      # PostForge > Uygulamalar ekranından alınan pf_live_... anahtarı
      api-key: ${POSTFORGE_API_KEY:}
      # Boşsa PostForge organizasyonundaki varsayılan gönderici hesabı kullanılır
      sender-code: ${POSTFORGE_SENDER_CODE:}
      timeout-seconds: ${POSTFORGE_TIMEOUT_SECONDS:10}
      # Tıklama/açılma takibi. PostForge'da takip gönderim başına açılır (şablona
      # bağlı değildir); alan hiç gönderilmezse takip kapalı sayılır.
      # NOT: track-clicks açıkken linkler PostForge'un /t/c/<token> adresiyle
      # değiştirilir — davet ve şifre sıfırlama linkleri de bu yönlendirmeden geçer.
      track-clicks: ${POSTFORGE_TRACK_CLICKS:true}
      track-opens: ${POSTFORGE_TRACK_OPENS:true}
      # PostForge > Webhook'lar ekranındaki gizli anahtar. Boşsa gelen bildirimler
      # reddedilir (imza doğrulanamaz) — davet durumları güncellenmez.
      webhook-secret: ${POSTFORGE_WEBHOOK_SECRET:}
  # E-postalardaki linklerde kullanılan frontend adresi
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  jwt:
    # Prod ortamında JWT_SECRET env variable kullanın (min 32 karakter)
    secret: ${JWT_SECRET:ScrumToolsSuperSecretKeyForJWTSigningMustBe256Bits1yusuf}
    # Token süresi ms cinsinden (default: 24 saat)
    expiration: ${JWT_EXPIRATION:86400000}
  # ─── Ortak Çalışma Alanı (Collab) — COLLAB_WORKSPACE_PLAN.md ───────────────
  collab:
    # K9: broker ve oturum kaydı süreç-içidir; backend YATAY ÖLÇEKLENEMEZ.
    # Bu bayrak ölçeklemeyi açmaz, yalnızca açılış uyarısını ve
    # /actuator/health içindeki collab raporunu kontrol eder.
    single-instance: ${COLLAB_SINGLE_INSTANCE:true}
    # /ws/collab üzerinde tek ikili çerçevenin üst sınırı (bayt)
    max-binary-message-size: ${COLLAB_MAX_BINARY_MESSAGE_SIZE:1048576}
    # §12: aynı dokümana gelen güncellemelerin tek INSERT'e toplandığı pencere (ms)
    append-batch-window-ms: ${COLLAB_APPEND_BATCH_WINDOW_MS:1000}
  media:
    # İçeriğe gömülü görsellerin kalıcı /api/media linklerini imzalayan anahtar.
    # Varsayılan olarak JWT secret'ı kullanılır; DEĞİŞTİRİLİRSE eski içerikteki tüm
    # görsel bağlantıları geçersiz olur (JWT secret'ı rotate ediyorsanız bunu ayrı
    # ve sabit bir değere set edin).
    secret: ${MEDIA_SECRET:${JWT_SECRET:ScrumToolsSuperSecretKeyForJWTSigningMustBe256Bits1yusuf}}

logging:
  level:
    com.scrumtools: DEBUG
    org.springframework.security: INFO

